:root{--bg:#14161a;--fg:#e8e8e8;--pn:#1e2127;--bd:#333;--match:#22c55e;--variant:#f59e0b;--draft:#ef4444}

.match{--c:var(--match)}.variant{--c:var(--variant)}.draft{--c:var(--draft)}
.box{border-color:var(--c)}.box span{background:var(--c)}.row{border-left-color:var(--c)}
